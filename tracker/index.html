<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · AI Learning Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
<div id="topbar-root"></div>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <main class="content">

    <div class="page-head flex justify-between items-center" style="flex-wrap:wrap; gap:14px;">
      <div>
        <div class="page-eyebrow">Master Dashboard</div>
        <h1 class="page-title">Where am I?</h1>
        <p class="page-sub">Everything you need to answer that, at a glance — current position, what's done, what's pending, and what's blocking you.</p>
      </div>
      <span class="blocker-count" id="dash-blocker-pill" style="display:none"></span>
    </div>

    <!-- YOU ARE HERE -->
    <section id="here-card" class="mb-16"></section>

    <!-- Stat grid -->
    <section class="grid grid-stats mb-16" id="stat-grid"></section>

    <div class="grid grid-2" style="align-items:start;">
      <!-- Phase progress -->
      <section class="card">
        <div class="section-title">Phase Progress</div>
        <div id="phase-progress-list" class="flex-col gap-12"></div>
      </section>

      <div class="flex-col gap-16">
        <!-- Skills snapshot -->
        <section class="card">
          <div class="flex justify-between items-center mb-12">
            <div class="section-title" style="margin-bottom:0;">Skills Snapshot</div>
            <a href="skills.html" class="link-ext">Open Skills</a>
          </div>
          <div id="skills-snapshot"></div>
        </section>

        <!-- Assessments snapshot -->
        <section class="card">
          <div class="flex justify-between items-center mb-12">
            <div class="section-title" style="margin-bottom:0;">Assessments</div>
            <a href="assessments.html" class="link-ext">Open Assessments</a>
          </div>
          <div id="assessments-snapshot"></div>
        </section>
      </div>
    </div>

    <!-- Mini roadmap strip -->
    <section class="card mt-16">
      <div class="flex justify-between items-center mb-12">
        <div class="section-title" style="margin-bottom:0;">Roadmap at a Glance</div>
        <a href="roadmap.html" class="link-ext">Full roadmap</a>
      </div>
      <div id="mini-roadmap"></div>
    </section>

  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
